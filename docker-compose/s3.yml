# E2E Testing: S3 Configuration
# This file defines the S3 storage service and backup/restore container

services:
  # Garage S3-compatible storage
  s3:
    image: dxflrs/garage:v2.4.1
    container_name: garage-e2e
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: gitea-backup
    ports:
      - "3900:3900"
    volumes:
      - garage-data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  # Base backup/restore process
  gitea-backup-restore:
    build:
      context: ../.
      dockerfile: Dockerfile
    container_name: gitea-backup-e2e
    user: "1000:1000"
    environment:
      # Backup configuration for S3
      BACKUP_ENABLE: "true"
      BACKUP_METHODE: "s3"
      ENDPOINT_URL: "http://s3:3900"
      AWS_ACCESS_KEY_ID: "GK0123456789abcdef0123456789abcdef"
      AWS_SECRET_ACCESS_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      BUCKET: "gitea-backup"
      BACKUP_PREFIX: "e2e-test-s3"
      BACKUP_MAX_RETENTION: "3"
      REGION: "garage"
      # Gitea configuration
      APP_INI_PATH: "/data/gitea/conf/app.ini"
      GITEA_USER: "1000:1000"
    volumes:
      - gitea-data:/data
    command: ["sleep", "infinity"]
    depends_on:
      - s3

volumes:
  garage-data:
  gitea-data:
